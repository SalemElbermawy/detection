<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Classification</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

    <header>
        <div class="logo">

            Image Detection

        </div>

        <nav class="links">
            <a href="#">Home</a>
            <a href="churn.html">Churn</a>
            <a href="flowers.html">Flowers</a>
        </nav>
    </header>

    <main class="container">

        <div class="box">
            <h2>Global Image Classification</h2>
            <p>Upload Your Image And See The Detection Of It Below</p>
            
            <div class="image-uploud">
                <h3>Upload Your Image To Classify</h3>

                <label for="imageInput">Upload Image</label>
                <input type="file" id="imageInput" accept="image/*">
                <div class="imageShow">
                    <!-- <img src="fish.jpg" alt=""> -->
                </div>
                <button onclick="sendImage()" class="predictButton">Predict Now</button>
            </div>

            <div class="result hidden">
                <h3>The Result :</h3>
                <h4 class="prediction"></h4>
            </div>
        </div>
        

    </main>
    <script src="main_image.js"></script>
</body>
</html>
